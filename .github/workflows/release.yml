# Build + publish a multi-platform release.
#
# Triggered by pushing a git tag like `v1.0.1`. Two parallel build jobs:
#   build-windows   -> celebratedesk-<version>-setup.exe + latest.yml
#   build-mac-arm64 -> celebratedesk-<version>-arm64.dmg + latest-mac.yml
# Both attach to the same DRAFT GitHub Release. The promote-release job
# flips that draft to public once both builds succeed. The OS-specific
# manifest tells each running app which file to download.
#
# Apple Silicon only on the Mac side: there is intentionally NO
# build-mac-x64 job. GitHub retired the Intel-default macOS runner
# (macos-13), so that job sat for 24h awaiting a runner that never came,
# then failed. Because promote-release waited on it, every release stayed
# a draft and never went public. We have no Intel Macs to support, so the
# job was removed. Do NOT add an x64 Mac job back unless an Intel Mac
# actually needs the build AND a working Intel macOS runner exists again.
#
# Auto-update story:
#   - Windows mini PCs: silent differential updates via electron-updater
#     (no signing needed because Squirrel handles the install).
#   - Mac (your dev machine): the update check + download still happens,
#     but installing an unsigned update is blocked by Gatekeeper. So on
#     Mac you'll get a "new version available" toast, and you can grab
#     the DMG from the Releases page when you actually want to update.
#     Buying a $99/yr Apple Developer cert would enable seamless Mac
#     auto-updates if it ever matters; for now it's manual on Mac.
#
# Neither platform is code-signed (cert costs aren't worth it for a gym
# kiosk). One-time Gatekeeper / SmartScreen prompt on first install,
# then the auto-update channel handles everything else on Windows.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: '0'
      - run: npm run build
      - run: npm test
      - name: Build + publish Windows installer
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-arm64:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: '0'
      - run: npm run build
      - run: npm test
      # Apple Silicon DMG. macos-latest runners are arm64, so npm naturally
      # fetches the arm64 sharp binary. Universal builds fail because of
      # sharp's per-arch native files conflicting in @electron/universal,
      # so we ship a single per-arch arm64 DMG from this job.
      - name: Build + publish arm64 DMG
        run: npm run build:mac -- --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-release:
    needs: [build-windows, build-mac-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote draft release to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
